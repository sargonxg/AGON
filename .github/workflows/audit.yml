name: audit
on:
  workflow_dispatch:
  pull_request:
    paths: ["Cargo.*", "deny.toml", "LICENSE", "crates/**", ".github/workflows/audit.yml"]
  schedule: [{ cron: "0 6 * * 1" }]
  push:
    paths:
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/audit.yml"

permissions:
  contents: read

jobs:
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - run: cargo install --locked cargo-audit --version 0.23.0
      - run: cargo audit
  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95.0"
      - run: cargo install --locked cargo-deny --version 0.20.2
      - run: cargo deny check
